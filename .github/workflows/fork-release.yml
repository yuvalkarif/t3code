# Fork-only: republishes each upstream T3 Code release with the `patches` branch applied
# to the Linux x64 server, in the same layout as upstream's GitHub release. T3 desktop
# installs it on SSH machines when it runs with
#   T3CODE_RELEASE_BASE_URL=https://github.com/<this fork>/releases/download
# The other archives are upstream's, unchanged. If the patch stops applying, the run fails
# and nothing is published: SSH machines keep the version they have.
name: Fork release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Upstream version without the v, such as 0.1.12. Empty means the latest release.
        required: false
      force:
        description: Rebuild even when this fork already has the release.
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  UPSTREAM: pingdotgg/t3code

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [ -z "$version" ]; then
            version="$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)"
            version="${version#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != "true" ] && gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already published here."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the patches branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: patches
          fetch-depth: 0
          filter: blob:none

      - name: Apply patches to the upstream release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Upstream tags live under refs/upstream-tags so the fork's own release tags never clash.
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "+refs/tags/v*:refs/upstream-tags/v*"
          base=""
          # Stable releases only: nightly and preview tags carry a "-" suffix.
          for name in $(git for-each-ref --sort=-creatordate --format='%(refname:lstrip=2)' refs/upstream-tags/ | grep -v -- '-'); do
            if git merge-base --is-ancestor "upstream-tags/$name" patches; then base="upstream-tags/$name"; break; fi
          done
          test -n "$base" || { echo "::error::No upstream release tag is an ancestor of patches."; exit 1; }
          echo "base=$base" >> "$GITHUB_ENV"
          echo "Patches: $(git rev-list --count "$base..patches") commit(s) on ${base#upstream-tags/}"
          git checkout -B "release/v$VERSION" "upstream-tags/v$VERSION"
          if ! git cherry-pick "$base..patches"; then
            git cherry-pick --abort || true
            echo "::error::The patches no longer apply to v$VERSION. Rebase the patches branch onto v$VERSION."
            exit 1
          fi

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Build the server executable
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$VERSION"
          vp run --filter t3 build
          node apps/server/scripts/cli.ts build-exe --verbose

      - name: Repack the upstream archive with the patched executable
        run: |
          set -euo pipefail
          command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }
          mkdir -p upstream out stage
          gh release download "v$VERSION" -R "$UPSTREAM" -D upstream -p SHA256SUMS -p "t3-$VERSION-*"
          (cd upstream && sha256sum -c --ignore-missing SHA256SUMS)
          name="t3-$VERSION-linux-x64"
          tar -xzf "upstream/$name.tar.gz" -C stage
          rpath="$(patchelf --print-rpath "stage/$name/t3")"
          install -m 0755 apps/server/dist-exe/t3 "stage/$name/t3"
          if [ -n "$rpath" ]; then patchelf --set-rpath "$rpath" "stage/$name/t3"; fi
          test "$("stage/$name/t3" --version)" = "t3 v$VERSION"
          tar -czf "out/$name.tar.gz" --owner=0 --group=0 -C stage "$name"
          for f in upstream/t3-*; do
            case "$f" in */"$name.tar.gz") ;; *) cp "$f" out/ ;; esac
          done
          (cd out && sha256sum t3-* > SHA256SUMS && cat SHA256SUMS)

      - name: Smoke-test the archive
        run: node scripts/smoke-cli-archive.ts --archive "out/t3-$VERSION-linux-x64.tar.gz" --expect-version "$VERSION"

      - name: Publish the release
        run: |
          set -euo pipefail
          up="upstream-tags/v$VERSION"
          {
            echo "Upstream [T3 Code v$VERSION](https://github.com/$UPSTREAM/releases/tag/v$VERSION) with the \`patches\` branch applied to the Linux x64 server. The other archives are upstream's, unchanged."
            echo
            echo "**Patch** ($(git rev-list --count "$up..HEAD") commit(s), written against ${base#upstream-tags/}): [view the diff](https://github.com/$UPSTREAM/compare/v$VERSION...${GITHUB_REPOSITORY%%/*}:t3code:release/v$VERSION)"
            echo
            echo '```'
            git diff --stat "$up" HEAD
            echo '```'
            if [ "$base" != "$up" ]; then
              echo
              echo "Upstream changes since ${base#upstream-tags/} in the files the patch touches:"
              echo
              echo '```'
              git diff --stat "$base" "$up" -- $(git diff --name-only "$up" HEAD) || true
              echo '```'
            fi
          } > notes.md
          git push --force origin "release/v$VERSION"
          gh release delete "v$VERSION" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VERSION" out/* -R "$GITHUB_REPOSITORY" \
            --target "release/v$VERSION" \
            --title "v$VERSION + Claude Remote Control" \
            --notes-file notes.md

      - name: Open an issue when the patch does not apply or the build fails
        if: failure()
        run: |
          set -euo pipefail
          title="Fork release v$VERSION failed"
          body="The [Fork release run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for v$VERSION failed. Nothing was published, so SSH machines cannot install v$VERSION from this fork until it is fixed.

          If the patch no longer applies: rebase \`patches\` onto v$VERSION, resolve the conflicts, force-push, then run **Fork release** with version $VERSION."
          existing="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')"
          if [ -n "$existing" ]; then gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi

  # Early warning: does the patch still apply to upstream main, which becomes the next release?
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: patches
          fetch-depth: 0
          filter: blob:none
      - name: Try the patch on upstream main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" main:upstream-main
          # Upstream tags live under refs/upstream-tags so the fork's own release tags never clash.
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "+refs/tags/v*:refs/upstream-tags/v*"
          base=""
          # Stable releases only: nightly and preview tags carry a "-" suffix.
          for name in $(git for-each-ref --sort=-creatordate --format='%(refname:lstrip=2)' refs/upstream-tags/ | grep -v -- '-'); do
            if git merge-base --is-ancestor "upstream-tags/$name" patches; then base="upstream-tags/$name"; break; fi
          done
          test -n "$base" || { echo "::error::No upstream release tag is an ancestor of patches."; exit 1; }
          git checkout -q upstream-main
          title="Patch will conflict with the next T3 release"
          existing="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')"
          if git cherry-pick "$base..patches" >/dev/null 2>&1; then
            echo "The patch applies cleanly to upstream main."
            if [ -n "$existing" ]; then gh issue close "$existing" -R "$GITHUB_REPOSITORY" --comment "Applies cleanly to upstream main again."; fi
            exit 0
          fi
          files="$(git diff --name-only --diff-filter=U)"
          git cherry-pick --abort || true
          echo "::warning::The patch conflicts with upstream main in: $files"
          if [ -z "$existing" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "The \`patches\` branch no longer applies cleanly to upstream main (checked $(date -u +%F)). The next T3 release will need a rebase.

          Conflicting files:
          \`\`\`
          $files
          \`\`\`

          Nothing is broken yet: current releases keep working. To get ahead of it, rebase \`patches\` onto upstream main's changes, or wait for the release and rebase onto its tag."
          fi
